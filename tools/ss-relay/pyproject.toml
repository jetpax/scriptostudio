[project]
name = "ss-relay"
version = "0.1.0"
description = "Stdio MCP relay for Scripto Studio devices, with file transfer by host path"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["websockets>=13", "zeroconf>=0.130"]

[project.optional-dependencies]
flash = ["esptool>=4.7"]

[project.scripts]
ss-relay = "ss_relay.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ss_relay"]
